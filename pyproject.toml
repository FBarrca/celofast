[project]
name = "celofast"
version = "0.5.2"
description = "Typed Celonis Knowledge Model objects, View inputs, and augmentation-table outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=1.23.5,<3.0",
    "pandas>=1.5.2,<3.0",
    "pydantic>=2.0,<3.0",
    "pycelonis==2.15.1",
    "pycelonis-core==2.10.4",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.6,<5.0",
    "saolapy==0.3.3",
]

[project.scripts]
celofast = "celofast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celofast"]

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.celofast.knowledge-models.inventory]
space-id = "9f7cc225-132d-49e7-8b0d-b626b1000b41"
package-id = "c1721b64-5f2c-4311-99ee-8177f0839c92"
key = "dm_test_perspective_celonis_inventorymanagement-km"
mode = "draft"
output = "generated/inventory"
mapping = "inventory-objects.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: online tests that pull the Inventory KM and read tenant data (need credentials)",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.uv.sources]
pycelonis = { url = "https://pypi.celonis.cloud/pycelonis/pycelonis-2.15.1-py3-none-any.whl" }
pycelonis-core = { url = "https://pypi.celonis.cloud/pycelonis-core/pycelonis_core-2.10.4-py3-none-any.whl" }
saolapy = { url = "https://pypi.celonis.cloud/saolapy/saolapy-0.3.3-py3-none-any.whl" }
