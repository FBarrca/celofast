[project]
name = "celofast"
version = "0.3.0"
description = "PyCelonis-native MLWB inputs and augmentation-table outputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "pycelonis>=2.15.1,<3.0",
    "pycelonis-core>=2.10.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "saolapy>=0.3.3,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "celonis"
url = "https://pypi.celonis.cloud/"
explicit = true

[tool.uv.sources]
pycelonis = { index = "celonis" }
pycelonis-core = { index = "celonis" }
saolapy = { index = "celonis" }
