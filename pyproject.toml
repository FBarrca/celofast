[project]
name = "celofast"
version = "0.3.0"
description = "PyCelonis-native MLWB inputs and augmentation-table outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5,<3.0",
    "pandas>=1.5.2,<3.0",
    "pydantic>=2.0,<3.0",
    # The Celonis repository exposes package-specific indexes rather than a
    # pip-compatible /simple index. Direct references keep pip from trying
    # (and failing) to resolve these packages on public PyPI.
    "pycelonis @ https://pypi.celonis.cloud/pycelonis/pycelonis-2.15.1-py3-none-any.whl#sha256=d52b7316683cee62668b02703ab3b53b9b915702dcc60efe79ca4afb2d623b6f",
    "pycelonis-core @ https://pypi.celonis.cloud/pycelonis-core/pycelonis_core-2.10.4-py3-none-any.whl#sha256=eb54e081c044a662e90ad6dc287cf1676f635995ab2c9d101252204fa474f667",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "saolapy @ https://pypi.celonis.cloud/saolapy/saolapy-0.3.3-py3-none-any.whl#sha256=12ff085493778415d941ac74e1b79c469e20bc9fb10761b2f5a45582b5f551be",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celofast"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
