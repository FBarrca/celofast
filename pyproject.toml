[project]
name = "celofast"
version = "0.3.0"
description = "PyCelonis-native MLWB inputs and augmentation-table outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=1.23.5,<3.0",
    "pandas>=1.5.2,<3.0",
    "pydantic>=2.0,<3.0",
    "pycelonis==2.15.1",
    "pycelonis-core==2.10.4",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.6,<5.0",
    "saolapy==0.3.3",
]

[project.scripts]
celofast = "celofast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celofast"]

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.uv.sources]
pycelonis = { url = "https://pypi.celonis.cloud/pycelonis/pycelonis-2.15.1-py3-none-any.whl" }
pycelonis-core = { url = "https://pypi.celonis.cloud/pycelonis-core/pycelonis_core-2.10.4-py3-none-any.whl" }
saolapy = { url = "https://pypi.celonis.cloud/saolapy/saolapy-0.3.3-py3-none-any.whl" }
