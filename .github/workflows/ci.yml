name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups
        env:
          UV_INDEX_CELONIS_USERNAME: ${{ secrets.CELONIS_PYPI_USERNAME }}
          UV_INDEX_CELONIS_PASSWORD: ${{ secrets.CELONIS_PYPI_PASSWORD }}

      - name: Run tests
        run: uv run --locked pytest -q
