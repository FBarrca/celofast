# Object mapping for the Inventory Management KM used by the live tests.
# Seven object types with declared relationships; other records are excluded.
# Excluded fields are calculated attributes (untyped, parameterized, or with
# cloud dependencies that fail in this KM) and duplicate projections of a
# column that is already loaded. Regenerate with: uv run celofast km pull inventory

exclude = [
    "EL_CELONIS_DELIVERYLINE",
    "EL_CELONIS_MATERIALMOVEMENT",
    "EL_CELONIS_PRODUCTIONORDER",
    "EL_CELONIS_PURCHASEDOCUMENT",
    "EL_CELONIS_PURCHASEDOCUMENTLINE",
    "EL__PRODUCTIONORDERACTIVITIES",
    "EL__PURCHASEDOCUMENTLINEACTIVITIES",
    "EL__SALESORDERSCHEDULELINEACTIVITIES",
    "MLFLOW_AUGMENTATION_ANCHOR",
    "MLFLOW_EXPERIMENTS",
    "MLFLOW_METRICS",
    "MLFLOW_PARAMS",
    "MLFLOW_RUNS",
    "MLFLOW_TAGS",
    "O_CELONIS_BILLOFMATERIALCOMPONENT",
    "O_CELONIS_BILLOFMATERIALPRODUCT",
    "O_CELONIS_CURRENCYCONVERSION",
    "O_CELONIS_CUSTOMER",
    "O_CELONIS_DELIVERYLINE",
    "O_CELONIS_MATERIAL",
    "O_CELONIS_MATERIALMOVEMENT",
    "O_CELONIS_MATERIALREQUIREMENT",
    "O_CELONIS_MATERIALRESERVATION",
    "O_CELONIS_PRODUCTIONORDER",
    "O_CELONIS_PURCHASEREQUISITIONLINE",
    "O_CELONIS_PURCHASEREQUISITIONLINE__VENDOR",
    "O_CELONIS_QUANTITYCONVERSION",
    "O_CELONIS_RELATIONSHIPBILLOFMATERIALS",
    "O_CELONIS_SALESORDER",
    "O_CELONIS_SALESORDERSCHEDULELINE",
    "O_CELONIS_STOCKHISTORY",
    "PY_REPRO_SCHEMA_3681A0EE",
    "R_O_CELONIS_DELIVERYLINE__SALESORDERSCHEDULELINES",
]

[objects.O_CELONIS_PLANT]
class = "Plant"
key = ["ID"]
exclude-fields = [
    "NumberFormatted",
    "NumberNameConcat",
]

[objects.O_CELONIS_PLANT.links.materials]
target = "O_CELONIS_MATERIALMASTERPLANT"
cardinality = "many"
on = { ID = "PLANT_ID" }

[objects.O_CELONIS_MATERIALMASTERPLANT]
class = "MaterialMasterPlant"
key = ["ID"]
exclude-fields = [
    "ABCClassification",
    "ABCXYZClassification",
    "ActualProductionLeadTime",
    "ActualPurchaseLeadTime",
    "ActualReplenishmentLeadTime",
    "AllNode",
    "AllNodeIndicator",
    "AvgCurrentValuatedStockAmountConvertedMonth",
    "AvgInventoryVal12Months",
    "AvgMaterialPurchaseLeadTime12Months",
    "AvgMonthlyConsQty12Months",
    "AvgProductionLeadTime12Months",
    "ConsumptionQty12Months",
    "ConsumptionVal12Months",
    "Country",
    "CurrentValuatedStockAmountConverted",
    "CurrentValuatedStockQuantity",
    "DaysOfCover12Months",
    "DiscontinuedMaterial",
    "EndNodeIndicator",
    "HasPurchaseDocumentLines",
    "HasSalesOrderScheduleLines",
    "HasUncoveredOpenDemand",
    "HighestStockLevel12Months",
    "IncomingBomLinkIndicator",
    "IsEndNode",
    "IsStartNode",
    "LegacyStockValue",
    "LowestStockLevel12Months",
    "MRPControllerFormatted",
    "MRPTypeFormatted",
    "MaterialMissingValuation",
    "MaterialNumberNamePlantNumberNameConcat",
    "MaterialNumberPlantNumberConcat",
    "MedianProductionLeadTime12Months",
    "MedianPurchaseLeadTime12Months",
    "NetworkStreams",
    "NoIncomingBomLinkIndicator",
    "NoSelfLinkLinkIndicator",
    "NumIncomingBillOfMaterialLinks",
    "NumIncomingMaterialDocumentItems",
    "NumMaterialRequirements",
    "NumMaterialReservations",
    "NumOutgoingBillOfMaterialLinks",
    "NumOutgoingMaterialDocumentItems",
    "NumPlannedOrders",
    "NumProductionOrders",
    "NumPurchaseDocumentLines",
    "NumPurchaseRequisitionLines",
    "NumSalesOrderScheduleLines",
    "NumSalesOrderScheduleLinesWithoutGoodsIssue",
    "NumSelfBillOfMaterialLinks",
    "ObsoleteStockValue",
    "OpenSalesOrderScheduleLineBackorderValue",
    "OpenSalesOrderScheduleLineValue",
    "OutgoingBomLinkIndicator",
    "PlannedPurchaseLeadTime",
    "PlannedReplenishmentLeadTime",
    "ProcurementTypeFormatted",
    "PurchaseDocumentValLate12Months",
    "ReplenishmentVal12Months",
    "SafetyStockLevelFormatted",
    "SafetyStockValue",
    "SalesOrderValueLate12Months",
    "ServiceLevelOnTime12Months",
    "ServiceLevelXYZ",
    "StandardDevConsQty12Months",
    "StartNode",
    "StdDevReplenishmentLeadTime",
    "SumConsumptionFutureQuantity",
    "SumConsumptionFutureValue",
    "SumDeliveryLineFutureQuantity",
    "SumDeliveryLineFutureValue",
    "SumMaterialRequirementFutureQuantity",
    "SumMaterialRequirementFutureValue",
    "SumMaterialReservationFutureQuantity",
    "SumMaterialReservationFutureValue",
    "SumPlannedSupplyFutureQuantity",
    "SumPlannedSupplyFutureValue",
    "SumProductionOrderFutureQuantity",
    "SumProductionOrderFutureValue",
    "SumPurchaseRequisitionLineFutureQuantity",
    "SumPurchaseRequisitionLineFutureValue",
    "SumPurchaseScheduleLineFutureQuantity",
    "SumPurchaseScheduleLineFutureValue",
    "SumReplenishmentFutureQuantity",
    "SumReplenishmentFutureValue",
    "SumSalesOrderScheduleLineFutureQuantity",
    "SumSalesOrderScheduleLineFutureValue",
    "SumSupplyFutureQuantity",
    "SumSupplyFutureValue",
    "SupplierReliability12Months",
    "UncoveredDemandFutureQuantity",
    "UncoveredDemandFutureValue",
    "UncoveredOpenDemandOrderQuantity",
    "UncoveredOpenDemandOrderValue",
    "UnitPriceConverted",
    "XYZClassification",
    "ZValue",
]

[objects.O_CELONIS_MATERIALMASTERPLANT.links.plant]
target = "O_CELONIS_PLANT"
cardinality = "one"
on = { PLANT_ID = "ID" }

[objects.O_CELONIS_MATERIALMASTERPLANT.links.planned_supplies]
target = "O_CELONIS_PLANNEDSUPPLY"
cardinality = "many"
on = { ID = "MATERIALMASTERPLANT_ID" }

[objects.O_CELONIS_MATERIALMASTERPLANT.links.purchase_schedule_lines]
target = "O_CELONIS_PURCHASESCHEDULELINE"
cardinality = "many"
on = { ID = "MATERIALMASTERPLANT_ID" }

[objects.O_CELONIS_PLANNEDSUPPLY]
class = "PlannedSupply"
key = ["ID"]
exclude-fields = [
    "AdjustmentQuantityConverted",
    "IsOpen",
    "ObjectTypeFormatted",
    "OrderFinishDateFormatted",
    "OrderQuantityConverted",
    "PlannedSupplyNumberFormatted",
]

[objects.O_CELONIS_PLANNEDSUPPLY.links.material_master_plant]
target = "O_CELONIS_MATERIALMASTERPLANT"
cardinality = "one"
on = { MATERIALMASTERPLANT_ID = "ID" }

[objects.O_CELONIS_PURCHASESCHEDULELINE]
class = "PurchaseScheduleLine"
key = ["ID"]
exclude-fields = [
    "DeliveryDate",
    "ExpectedQuantityConverted",
    "IsOpen",
    "PurchaseDocumentLine",
    "PurchaseDocumentNumber",
    "PurchaseOrderScheduleLine",
    "ReceivedQuantityConverted",
]
# The KM declares DATE, but values include a time of day.
types = { CREATIONTIME = "datetime" }

[objects.O_CELONIS_PURCHASESCHEDULELINE.links.purchase_document_line]
target = "O_CELONIS_PURCHASEDOCUMENTLINE"
cardinality = "one"
on = { PURCHASEDOCUMENTLINE_ID = "ID" }

# No Data Model foreign key joins these tables; PQL LOOKUP joins by value.
[objects.O_CELONIS_PURCHASESCHEDULELINE.links.plant]
target = "O_CELONIS_PLANT"
cardinality = "one"
on = { PLANT_ID = "ID" }

[objects.O_CELONIS_PURCHASESCHEDULELINE.links.material_master_plant]
target = "O_CELONIS_MATERIALMASTERPLANT"
cardinality = "one"
on = { MATERIALMASTERPLANT_ID = "ID" }

[objects.O_CELONIS_PURCHASEDOCUMENTLINE]
class = "PurchaseDocumentLine"
key = ["ID"]
exclude-fields = [
    "ActualLeadTime",
    "CreationTimeMonth",
    "DaysFromDueDate",
    "DeliveredLate",
    "DeliveredOnTime",
    "GoodsReceiptDate",
    "GracePeriodIsEarly",
    "GracePeriodIsLate",
    "IsDeletedFormatted",
    "IsGoodsReceiptRequiredFormatted",
    "IsOpen",
    "LineDeliveryDate",
    "MonthGoodsReceiptDate",
    "MonthsSinceGoodsReceipt",
    "NetAmountConverted",
    "NetUnitPriceConverted",
    "PurchaseDocumentLineNum",
    "PurchaseDocumentReceivedOutcomes",
]
# The KM declares DATE, but values include a time of day.
types = { CREATIONTIME = "datetime" }

[objects.O_CELONIS_PURCHASEDOCUMENTLINE.links.header]
target = "O_CELONIS_PURCHASEDOCUMENT"
cardinality = "one"
on = { HEADER_ID = "ID" }

[objects.O_CELONIS_PURCHASEDOCUMENTLINE.links.schedule_lines]
target = "O_CELONIS_PURCHASESCHEDULELINE"
cardinality = "many"
on = { ID = "PURCHASEDOCUMENTLINE_ID" }

[objects.O_CELONIS_PURCHASEDOCUMENT]
class = "PurchaseDocument"
key = ["ID"]
exclude-fields = [
    "IsDeletedFormatted",
]
# The KM declares DATE, but values include a time of day.
types = { CREATIONTIME = "datetime" }

[objects.O_CELONIS_PURCHASEDOCUMENT.links.vendor]
target = "O_CELONIS_VENDOR"
cardinality = "one"
on = { VENDOR_ID = "ID" }

[objects.O_CELONIS_PURCHASEDOCUMENT.links.lines]
target = "O_CELONIS_PURCHASEDOCUMENTLINE"
cardinality = "many"
on = { ID = "HEADER_ID" }

[objects.O_CELONIS_VENDOR]
class = "Vendor"
key = ["ID"]
exclude-fields = [
    "City",
    "Country",
    "IDENTIFIER_AS_ATTRIBUTE",
    "IsInternalSupplier",
    "SupplierNumberNameConcat",
]

[objects.O_CELONIS_VENDOR.links.purchase_documents]
target = "O_CELONIS_PURCHASEDOCUMENT"
cardinality = "many"
on = { ID = "VENDOR_ID" }
