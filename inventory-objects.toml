# Link-name overrides for the Inventory Management KM used by the tests.
# Everything else (object types, keys, field types, links) is derived from
# Celonis at pull. Without this file the links below would get automatic
# names (material_master_plants, purchase_schedule_lines,
# purchase_document_lines), and PurchaseScheduleLine.plant would not exist.
# Regenerate with: uv run celofast km pull inventory

[objects.O_CELONIS_PLANT.links.materials]
target = "O_CELONIS_MATERIALMASTERPLANT"
cardinality = "many"
on = { ID = "PLANT_ID" }

[objects.O_CELONIS_PURCHASEDOCUMENTLINE.links.schedule_lines]
target = "O_CELONIS_PURCHASESCHEDULELINE"
cardinality = "many"
on = { ID = "PURCHASEDOCUMENTLINE_ID" }

[objects.O_CELONIS_PURCHASEDOCUMENT.links.lines]
target = "O_CELONIS_PURCHASEDOCUMENTLINE"
cardinality = "many"
on = { ID = "HEADER_ID" }

# No Data Model foreign key joins these tables; PQL LOOKUP joins by value.
[objects.O_CELONIS_PURCHASESCHEDULELINE.links.plant]
target = "O_CELONIS_PLANT"
cardinality = "one"
on = { PLANT_ID = "ID" }
